<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Character Image (Replace href with your actual MyIMG_2.png base64 data) -->
    <image id="character" href="data:image/png;base64,...(base64 data from MyIMG_2.png)..." x="650" y="150" width="500" height="500"/>
    
    <!-- Gradients -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d132a9"/>
      <stop offset="100%" stop-color="#9a2bb1"/>
    </linearGradient>
    
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5fb"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-opacity="0.05"/>
    </filter>
    
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animations -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Pacifico&amp;family=Fira+Code:wght@400;500&amp;family=Nunito:wght@400;600;700&amp;display=swap');
      
      .code-text { font-family: 'Fira Code', monospace; font-size: 14px; fill: #555; }
      .main-text { font-family: 'Nunito', sans-serif; fill: #333; }
      .cursive-name { font-family: 'Pacifico', cursive; font-size: 65px; fill: url(#textGradient); }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      
      @keyframes popIn {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes typing {
        from { width: 0; }
        to { width: 100%; }
      }

      .floating { animation: float 4s ease-in-out infinite; }
      .pop-in { animation: popIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
      .typewriter { overflow: hidden; white-space: nowrap; animation: typing 2s steps(40, end) forwards; }
    </style>
    
    <!-- Scanner Sweep Mask -->
    <mask id="scannerMask">
      <rect width="100%" height="100%" fill="white"/>
    </mask>
  </defs>

  <!-- Main Background Card -->
  <rect width="1190" height="740" x="5" y="5" rx="20" fill="#ffffff" stroke="#e0b3ff" stroke-width="2"/>
  <rect width="1190" height="740" x="5" y="5" rx="20" fill="url(#boxGradient)" opacity="0.5"/>

  <!-- =============================== -->
  <!-- LEFT COLUMN                     -->
  <!-- =============================== -->

  <!-- Terminal Header -->
  <text x="50" y="60" font-family="'Fira Code', monospace" font-size="14" fill="#00a86b" font-weight="bold">
    sameer@ai-dev:~$ <tspan fill="#666">cat README.md</tspan>
  </text>
  <rect x="250" y="48" width="8" height="15" fill="#00a86b">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Greeting & Name -->
  <text x="50" y="110" class="main-text" font-size="28" font-weight="700">Hi, I'm 👋</text>
  <g transform="translate(50, 185)">
    <text x="0" y="0" class="cursive-name">Sameer Raj</text>
    <path d="M 330 -40 C 330 -50 345 -50 345 -40 C 345 -30 330 -20 330 -20 C 330 -20 315 -30 315 -40 C 315 -50 330 -50 330 -40 Z" fill="#ff4d94" transform="scale(0.8) translate(70, -10)" class="floating"/>
  </g>

  <!-- Role -->
  <text x="50" y="235" font-family="'Fira Code', monospace" font-size="20" fill="#b300b3" font-weight="bold">
    &lt; AI &amp; Web Developer /&gt;
  </text>

  <!-- Quote Box -->
  <g transform="translate(50, 260)" class="pop-in" style="animation-delay: 0.2s;">
    <rect width="450" height="80" rx="12" fill="#fff0f5" stroke="#ffb3d9" stroke-width="2"/>
    <rect x="0" y="15" width="4" height="50" fill="#d132a9"/>
    <text x="25" y="35" class="code-text" fill="#555">Weaving machine learning</text>
    <text x="25" y="60" class="code-text" fill="#d132a9" font-weight="bold">into the fabric of the web.</text>
    <path d="M 420 30 L 425 40 L 435 40 L 427 47 L 430 57 L 420 52 L 410 57 L 413 47 L 405 40 L 415 40 Z" fill="#d132a9" transform="scale(0.6) translate(280, 20)" class="floating"/>
  </g>

  <!-- Tech Stack -->
  <text x="50" y="375" class="main-text" font-size="16" font-weight="700" fill="#666">🧩 Tech I Know</text>
  <g transform="translate(50, 395)" font-family="'Nunito', sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="80" height="30" rx="15" fill="#fff" stroke="#ff9999" stroke-width="2"/><text x="40" y="20" fill="#cc0000">Python</text>
    <!-- Pill 2 -->
    <rect x="90" y="0" width="80" height="30" rx="15" fill="#fff" stroke="#99ccff" stroke-width="2"/><text x="130" y="20" fill="#0066cc">React</text>
    <!-- Pill 3 -->
    <rect x="180" y="0" width="110" height="30" rx="15" fill="#fff" stroke="#ffe680" stroke-width="2"/><text x="235" y="20" fill="#b38f00">JavaScript</text>
    <!-- Pill 4 -->
    <rect x="300" y="0" width="120" height="30" rx="15" fill="#fff" stroke="#b3ffcc" stroke-width="2"/><text x="360" y="20" fill="#009933">Machine Learning</text>
    <!-- Row 2 -->
    <rect x="0" y="40" width="70" height="30" rx="15" fill="#fff" stroke="#cc99ff" stroke-width="2"/><text x="35" y="60" fill="#6600cc">SQL</text>
    <rect x="80" y="40" width="120" height="30" rx="15" fill="#fff" stroke="#ffb3e6" stroke-width="2"/><text x="140" y="60" fill="#cc0088">Deep Learning</text>
  </g>

  <!-- About Me -->
  <text x="50" y="500" class="main-text" font-size="16" font-weight="700" fill="#d132a9">💖 About Me</text>
  <g transform="translate(50, 525)" class="code-text" font-size="15" fill="#444">
    <text x="0" y="0">>_ I build dreams with AI and scalable code.</text>
    <text x="0" y="25">💡 Obsessed with intelligent web interfaces.</text>
    <text x="0" y="50">🚀 Always learning, always building real-world solutions.</text>
  </g>

  <!-- Stats Box -->
  <g transform="translate(50, 600)" class="pop-in" style="animation-delay: 0.4s;">
    <rect width="500" height="70" rx="12" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#dropShadow)"/>
    <g font-family="'Nunito', sans-serif" text-anchor="middle">
      <text x="70" y="30" font-size="13" fill="#888" font-weight="600">📦 Repos</text>
      <text x="70" y="55" font-size="18" fill="#d132a9" font-weight="700">35+</text>
      <line x1="135" y1="15" x2="135" y2="55" stroke="#eee" stroke-width="1"/>
      
      <text x="195" y="30" font-size="13" fill="#888" font-weight="600">💻 Commits</text>
      <text x="195" y="55" font-size="18" fill="#d132a9" font-weight="700">1.5k+</text>
      <line x1="260" y1="15" x2="260" y2="55" stroke="#eee" stroke-width="1"/>
      
      <text x="320" y="30" font-size="13" fill="#888" font-weight="600">⭐ Stars</text>
      <text x="320" y="55" font-size="18" fill="#d132a9" font-weight="700">50+</text>
      <line x1="385" y1="15" x2="385" y2="55" stroke="#eee" stroke-width="1"/>
      
      <text x="445" y="30" font-size="13" fill="#888" font-weight="600">👥 Followers</text>
      <text x="445" y="55" font-size="18" fill="#d132a9" font-weight="700">20+</text>
    </g>
  </g>


  <!-- =============================== -->
  <!-- CENTER / RIGHT COLUMN           -->
  <!-- =============================== -->

  <!-- Code Editor Box -->
  <g transform="translate(580, 40)" class="floating" style="animation-duration: 6s;">
    <rect width="280" height="210" rx="10" fill="#ffffff" stroke="#e0b3ff" stroke-width="1.5" filter="url(#dropShadow)"/>
    <!-- Mac Buttons -->
    <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="20" r="6" fill="#27c93f"/>
    <text x="140" y="24" font-family="'Nunito', sans-serif" font-size="12" fill="#aaa" text-anchor="middle">dreams.jsx</text>
    <line x1="0" y1="35" x2="280" y2="35" stroke="#eee" stroke-width="1"/>
    
    <!-- Code Content -->
    <text x="20" y="65" class="code-text" font-size="13">
      <tspan fill="#b300b3">function</tspan> <tspan fill="#0066cc">buildDreams</tspan>() {
    </text>
    <text x="20" y="90" class="code-text" font-size="13">  <tspan fill="#b300b3">return</tspan> (</text>
    <text x="20" y="115" class="code-text" font-size="13">    &lt;<tspan fill="#cc0000">div</tspan> <tspan fill="#009933">className</tspan>=<tspan fill="#ff8c00">"future"</tspan>&gt;</text>
    <text x="20" y="140" class="code-text" font-size="13">      &lt;<tspan fill="#0066cc">Code</tspan> /&gt;</text>
    <text x="20" y="165" class="code-text" font-size="13">      &lt;<tspan fill="#0066cc">AI_Models</tspan> /&gt;</text>
    <text x="20" y="190" class="code-text" font-size="13">    &lt;/<tspan fill="#cc0000">div</tspan>&gt;</text>
    <text x="20" y="215" class="code-text" font-size="13">  );</text>
    <text x="20" y="240" class="code-text" font-size="13">}</text>
  </g>

  <!-- Keep Coding Box -->
  <g transform="translate(900, 60)" class="floating" style="animation-duration: 5s; animation-delay: 1s;">
    <rect width="220" height="120" rx="15" fill="#ffffff" stroke="#ffb3d9" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="110" y="50" font-family="'Fira Code', monospace" font-size="30" fill="#ff4d94" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
    <text x="110" y="80" font-family="'Nunito', sans-serif" font-size="16" fill="#d132a9" font-weight="800" text-anchor="middle" letter-spacing="1">KEEP CODING</text>
    <text x="110" y="105" font-family="'Nunito', sans-serif" font-size="16" fill="#b300b3" font-weight="800" text-anchor="middle" letter-spacing="1">KEEP GROWING</text>
  </g>

  <!-- Character Image -->
  <g class="pop-in" style="animation-delay: 0.6s;">
    <use href="#character"/>
  </g>

  <!-- Decorative Elements (Hearts & Sparkles) -->
  <path d="M 550 300 C 550 290 565 290 565 300 C 565 310 550 320 550 320 C 550 320 535 310 535 300 C 535 290 550 290 550 300 Z" fill="#b300b3" opacity="0.6" transform="scale(0.5) translate(500, 50)" class="floating"/>
  <path d="M 1120 320 C 1120 310 1135 310 1135 320 C 1135 330 1120 340 1120 340 C 1120 340 1105 330 1105 320 C 1105 310 1120 310 1120 320 Z" fill="#ff4d94" transform="scale(0.8) translate(250, 50)" class="floating" style="animation-delay: 1.5s;"/>
  
  <text x="450" y="140" font-size="24" fill="#ffb3d9" class="floating">✦</text>
  <text x="830" y="140" font-size="20" fill="#e0b3ff" class="floating" style="animation-delay: 0.5s;">✦</text>

  <!-- =============================== -->
  <!-- FULL WIDTH SCANNER              -->
  <!-- =============================== -->
  
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#d132a9" stroke-width="2" opacity="0.6" filter="url(#neonGlow)">
    <animate attributeName="y1" from="0" to="750" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y2" from="0" to="750" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- =============================== -->
  <!-- FOOTER                          -->
  <!-- =============================== -->
  
  <line x1="40" y1="690" x2="1160" y2="690" stroke="#f0d9ff" stroke-width="1"/>
  
  <g transform="translate(50, 720)" font-family="'Nunito', sans-serif" font-size="13" fill="#666" font-weight="600">
    <!-- GitHub -->
    <text x="0" y="0">🐙 Sameer532005</text>
    <!-- Email -->
    <text x="180" y="0">✉️ Sameer532005@gmail.com</text>
    <!-- LinkedIn -->
    <text x="430" y="0">💼 linkedin.com/in/Sameer532005</text>
    
    <!-- Open to collaborate -->
    <circle cx="680" cy="-4" r="4" fill="#27c93f"/>
    <text x="690" y="0" fill="#27c93f">Open to collaborate</text>
    
    <!-- Bottom Quote -->
    <text x="910" y="0" fill="#d132a9" font-style="italic">"Code is my art, Logic is my superpower." 💖</text>
  </g>

</svg>
