<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#bf00ff" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <style>
      @keyframes slideIn { 0% { transform: translateX(20px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
      .stat-row { opacity: 0; animation: slideIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    </style>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="480" height="220" rx="12" fill="#121212" stroke="#2a2a2a" stroke-width="2"/>
  <rect width="480" height="220" rx="12" fill="url(#grid)"/>

  <!-- Cyberpunk UI Corner Accents -->
  <path d="M 12 25 L 12 12 L 25 12" fill="none" stroke="#bf00ff" stroke-width="2" filter="url(#purpleGlow)"/>
  <path d="M 468 195 L 468 208 L 455 208" fill="none" stroke="#bf00ff" stroke-width="2" filter="url(#purpleGlow)"/>

  <!-- Title / Header -->
  <text x="30" y="35" font-family="monospace" font-size="14" fill="#888888" letter-spacing="1">LANGUAGE_DATA <tspan fill="#bf00ff">::</tspan> SAMEER532005</text>
  <line x1="30" y1="45" x2="450" y2="45" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Languages Rows -->
  <g transform="translate(40, 70)">
    
    <!-- Python -->
    <g transform="translate(0, 0)">
      <g class="stat-row" style="animation-delay: 0.2s;">
        <text x="0" y="0" font-family="monospace" font-size="13" fill="#dddddd">Python</text>
        <text x="400" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#bf00ff" text-anchor="end">45.2%</text>
        <rect x="0" y="10" width="400" height="8" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
        <rect x="0" y="10" width="0" height="8" rx="4" fill="#bf00ff" filter="url(#purpleGlow)">
          <animate attributeName="width" from="0" to="180" dur="1s" begin="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
        </rect>
      </g>
    </g>

    <!-- JavaScript -->
    <g transform="translate(0, 40)">
      <g class="stat-row" style="animation-delay: 0.4s;">
        <text x="0" y="0" font-family="monospace" font-size="13" fill="#dddddd">JavaScript</text>
        <text x="400" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#bf00ff" text-anchor="end">30.8%</text>
        <rect x="0" y="10" width="400" height="8" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
        <rect x="0" y="10" width="0" height="8" rx="4" fill="#bf00ff" filter="url(#purpleGlow)">
          <animate attributeName="width" from="0" to="123" dur="1s" begin="1.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
        </rect>
      </g>
    </g>

    <!-- SQL -->
    <g transform="translate(0, 80)">
      <g class="stat-row" style="animation-delay: 0.6s;">
        <text x="0" y="0" font-family="monospace" font-size="13" fill="#dddddd">SQL</text>
        <text x="400" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#bf00ff" text-anchor="end">15.0%</text>
        <rect x="0" y="10" width="400" height="8" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
        <rect x="0" y="10" width="0" height="8" rx="4" fill="#bf00ff" filter="url(#purpleGlow)">
          <animate attributeName="width" from="0" to="60" dur="1s" begin="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
        </rect>
      </g>
    </g>
    
    <!-- HTML/CSS -->
    <g transform="translate(0, 120)">
      <g class="stat-row" style="animation-delay: 0.8s;">
        <text x="0" y="0" font-family="monospace" font-size="13" fill="#dddddd">HTML / CSS</text>
        <text x="400" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#bf00ff" text-anchor="end">9.0%</text>
        <rect x="0" y="10" width="400" height="8" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
        <rect x="0" y="10" width="0" height="8" rx="4" fill="#bf00ff" filter="url(#purpleGlow)">
          <animate attributeName="width" from="0" to="36" dur="1s" begin="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
        </rect>
      </g>
    </g>

  </g>
</svg>
