<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#bf00ff" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <style>
      @keyframes popIn { 0% { transform: translateY(20px) scale(0.9); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
      .trophy-cell { opacity: 0; animation: popIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .shine { animation: shineSweep 3s infinite linear; }
      @keyframes shineSweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="480" height="220" rx="12" fill="#121212" stroke="#2a2a2a" stroke-width="2"/>
  <rect width="480" height="220" rx="12" fill="url(#grid)"/>

  <!-- Cyberpunk UI Corner Accents -->
  <path d="M 12 25 L 12 12 L 25 12" fill="none" stroke="#bf00ff" stroke-width="2" filter="url(#purpleGlow)"/>
  <path d="M 468 195 L 468 208 L 455 208" fill="none" stroke="#bf00ff" stroke-width="2" filter="url(#purpleGlow)"/>

  <!-- Title / Header -->
  <text x="30" y="35" font-family="monospace" font-size="14" fill="#888888" letter-spacing="1">ACHIEVEMENTS <tspan fill="#bf00ff">::</tspan> SAMEER532005</text>
  <line x1="30" y1="45" x2="450" y2="45" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Trophies Container -->
  <g transform="translate(50, 75)">
    
    <!-- Trophy 1 -->
    <g transform="translate(0, 0)">
      <g class="trophy-cell" style="animation-delay: 0.2s;">
        <rect width="100" height="110" rx="8" fill="#1a1a1a" stroke="#bf00ff" stroke-width="1.5"/>
        <text x="50" y="25" font-family="monospace" font-size="12" fill="#dddddd" text-anchor="middle">Commits</text>
        <text x="50" y="70" font-family="monospace" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#purpleGlow)">SSS</text>
        <text x="50" y="95" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">Top 1%</text>
        <g clip-path="url(#cellClip)">
          <rect width="100" height="110" fill="url(#shineGradient)" class="shine"/>
        </g>
      </g>
    </g>

    <!-- Trophy 2 -->
    <g transform="translate(140, 0)">
      <g class="trophy-cell" style="animation-delay: 0.4s;">
        <rect width="100" height="110" rx="8" fill="#1a1a1a" stroke="#bf00ff" stroke-width="1.5"/>
        <text x="50" y="25" font-family="monospace" font-size="12" fill="#dddddd" text-anchor="middle">Issues</text>
        <text x="50" y="70" font-family="monospace" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#purpleGlow)">A+</text>
        <text x="50" y="95" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">Top 15%</text>
      </g>
    </g>

    <!-- Trophy 3 -->
    <g transform="translate(280, 0)">
      <g class="trophy-cell" style="animation-delay: 0.6s;">
        <rect width="100" height="110" rx="8" fill="#1a1a1a" stroke="#bf00ff" stroke-width="1.5"/>
        <text x="50" y="25" font-family="monospace" font-size="12" fill="#dddddd" text-anchor="middle">Stars</text>
        <text x="50" y="70" font-family="monospace" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#purpleGlow)">A</text>
        <text x="50" y="95" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">Top 20%</text>
      </g>
    </g>

  </g>

  <!-- Shine Effect Definitions -->
  <defs>
    <clipPath id="cellClip"><rect width="100" height="110" rx="8"/></clipPath>
    <linearGradient id="shineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#bf00ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>
