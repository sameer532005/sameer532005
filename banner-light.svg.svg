<svg width="1280" height="740" viewBox="0 0 1280 740" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Character from MyIMG.png as base64 PNG, adapt coloring for light background -->
    <image id="character-light" href="data:image/png;base64,...(re-embedded data from MyIMG.png?v=2)..." x="300" y="100" width="680" height="540"/>
    
    <!-- Adapt purple glows -->
    <filter id="purpleGlowLight">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Adapt Scan Line Gradient -->
    <linearGradient id="scanGradientLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cc33ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#cc33ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#cc33ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Reveal Mask -->
    <mask id="characterMaskLight">
      <rect width="100%" height="100%" fill="white"/>
      <rect id="scanLineLight" x="300" y="100" width="680" height="10" fill="url(#scanGradientLight)">
        <animate attributeName="y" from="100" to="640" dur="2s" fill="freeze" begin="0s"/>
        <animate attributeName="height" from="10" to="540" dur="2s" fill="freeze" begin="0s"/>
      </rect>
    </mask>

    <!-- Continuous Scanner Mask -->
    <mask id="continuousScannerMaskLight">
      <rect width="100%" height="100%" fill="white"/>
      <rect x="0" y="0" width="1280" height="10" fill="white">
        <animate attributeName="y" from="0" to="740" dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </mask>

    <!-- Adapt animations style -->
    <style>
      @keyframes type { from { width: 0; } to { width: 100%; } }
      @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      .typed-name-light path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: type 2s steps(10) forwards;
        filter: url(#purpleGlowLight);
      }
      .pop-in-letter-light { animation: popIn 0.5s ease-out forwards; opacity: 0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="740" fill="#ffffff"/>

  <!-- Character with reveal mask -->
  <use href="#character-light" mask="url(#characterMaskLight)"/>
  
  <!-- Continuous scanner -->
  <rect x="300" y="100" width="680" height="540" fill="none" stroke="url(#scanGradientLight)" stroke-width="2" mask="url(#continuousScannerMaskLight)"/>

  <!-- Terminal Typing Line -->
  <text x="50" y="50" font-family="monospace" font-size="20" fill="#cc33ff">
    user@dev:~ $ cat README.md<tspan fill="#cc33ff">_</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.5s"/>
  </text>
  
  <!-- Name with adapted gradient -->
  <g class="typed-name-light" transform="translate(150, 40)" filter="url(#purpleGlowLight)">
    <linearGradient id="nameGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff33ff"/>
      <stop offset="100%" stop-color="#cc33ff"/>
    </linearGradient>
    <path d="M...Sameer Raj..." fill="url(#nameGradientLight)" stroke="url(#nameGradientLight)" stroke-width="1.5">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="2s" begin="2.5s" fill="freeze"/>
    </path>
    <!-- pop-in letters... -->
  </g>

  <!-- Adapt Roles, Quote Box, About Me, Stats Bar, Code Editor, Neon Sign coloring... -->
</svg>
