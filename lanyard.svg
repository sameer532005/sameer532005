<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Face crop of character from MyIMG.png as base64 PNG -->
    <image id="faceCrop" href="data:image/png;base64,...(face-crop base64 data from MyIMG.png?v=2)..." x="60" y="120" width="80" height="80"/>
    
    <!-- Physics definitions for drop and ongoing gentle sway -->
    <animateTransform id="dropIn" attributeName="transform" type="translate" from="0,-400" to="0,0" dur="1.5s" begin="0s" fill="freeze"/>
    <animateTransform id="swing" attributeName="transform" type="rotate" values="10;0;-8;0;6;0;-4;0;2;0" dur="4s" begin="1.5s" repeatCount="1"/>
    <animateTransform id="gentleSway" attributeName="transform" type="rotate" values="1;0;-1;0" dur="5s" begin="5.5s" repeatCount="indefinite"/>
  </defs>

  <!-- Entire Lanyard group for combined movement -->
  <g transform="translate(100, 0)">
    <animateTransform attributeName="transform" xlink:href="#swing" type="rotate" additive="sum"/>
    <animateTransform attributeName="transform" xlink:href="#gentleSway" type="rotate" additive="sum"/>
    
    <!-- Pink Strap with printed text, with tall enough window -->
    <path d="M-10,0 C-10,40 -20,80 -20,120 A20,20 0 1,0 20,120 C20,80 10,40 10,0 Z" fill="#ff00ff"/>
    <text x="-50" y="80" font-family="monospace" font-size="12" fill="#121212" transform="rotate(-90)">AI &amp; Web Developer | Sameer Raj</text>
    
    <!-- Metal clasp -->
    <rect x="-15" y="120" width="30" height="30" rx="5" fill="#aaa" stroke="#888"/>
    <circle cx="0" cy="135" r="5" fill="#aaa" stroke="#888"/>

    <!-- ID Card (dark glass with glow) -->
    <g transform="translate(-50, 150)">
      <rect width="100" height="150" rx="10" fill="#1a1a1a" stroke="#bf00ff" stroke-width="2" opacity="0.8"/>
      
      <!-- Glowing avatar ring -->
      <circle cx="50" cy="50" r="30" fill="none" stroke="#bf00ff" stroke-width="3">
        <animate attributeName="stroke-dasharray" values="0,200; 200,0; 0,200" dur="2s" repeatCount="indefinite"/>
      </circle>
      <use href="#faceCrop"/>
      
      <!-- ID Details with tall enough windows -->
      <text x="50" y="90" font-family="monospace" font-size="12" fill="#bf00ff" text-anchor="middle">Sameer Raj</text>
      <text x="50" y="105" font-family="monospace" font-size="10" fill="#bf00ff" text-anchor="middle">AI &amp; Web Developer</text>
      <text x="50" y="120" font-family="monospace" font-size="8" fill="#bf00ff" text-anchor="middle">@Sameer532005</text>
      
      <!-- Barcode -->
      <rect x="10" y="130" width="80" height="10" fill="#bf00ff" opacity="0.3"/>
      
      <!-- Holographic Shine Sweep -->
      <rect width="100" height="150" rx="10" fill="none">
        <animate attributeName="fill" values="none; rgba(191,0,255,0.1); none" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
