<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon Purple Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#bf00ff" stroke-width="0.5" opacity="0.15"/>
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes slideIn {
        0% { transform: translateX(20px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 2px #bf00ff); }
        50% { filter: drop-shadow(0 0 8px #bf00ff); }
      }
      .stat-row { opacity: 0; animation: slideIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .rank-text { animation: pulseGlow 2s infinite; }
    </style>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="480" height="220" rx="12" fill="#121212" stroke="#2a2a2a" stroke-width="2"/>
  <rect width="480" height="220" rx="12" fill="url(#grid)"/>

  <!-- Cyberpunk UI Corner Accents -->
  <path d="M 12 25 L 12 12 L 25 12" fill="none" stroke="#bf00ff" stroke-width="2" filter="url(#purpleGlow)"/>
  <path d="M 468 195 L 468 208 L 455 208" fill="none" stroke="#bf00ff" stroke-width="2" filter="url(#purpleGlow)"/>

  <!-- Title / Header -->
  <text x="30" y="35" font-family="monospace" font-size="14" fill="#888888" letter-spacing="1">SYSTEM_STATS <tspan fill="#bf00ff">::</tspan> SAMEER532005</text>
  <line x1="30" y1="45" x2="450" y2="45" stroke="#2a2a2a" stroke-width="1"/>

  <!-- LEFT SIDE: RANK RING -->
  <g transform="translate(80, 130)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1a1a1a" stroke-width="8"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#bf00ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="283" filter="url(#purpleGlow)" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="283" to="40" dur="1.5s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </circle>
    <text x="0" y="12" font-family="monospace" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle" class="rank-text">S</text>
    <text x="0" y="30" font-family="monospace" font-size="10" fill="#bf00ff" text-anchor="middle" letter-spacing="2">RANK</text>
  </g>

  <!-- RIGHT SIDE: STAT ROWS (Fixed positioning wrappers) -->
  <g transform="translate(180, 70)">
    
    <!-- Stat 1: Commits -->
    <g transform="translate(0, 0)">
      <g class="stat-row" style="animation-delay: 0.3s;">
        <path d="M10.5 7.75a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm-2.5-1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm5.75 1.75a3.5 3.5 0 1 1-6.19 2.27L3.43 12.3A1.5 1.5 0 1 1 2.5 11l4.13-1.53A3.5 3.5 0 0 1 13.75 8.5Z" fill="#bf00ff" transform="scale(1.2) translate(0, -9)"/>
        <text x="25" y="0" font-family="monospace" font-size="13" fill="#dddddd">Total Commits</text>
        <text x="260" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#bf00ff" text-anchor="end">1.5k</text>
        <rect x="25" y="8" width="235" height="6" rx="3" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
        <rect x="25" y="8" width="0" height="6" rx="3" fill="#bf00ff" filter="url(#purpleGlow)">
          <animate attributeName="width" from="0" to="200" dur="1s" begin="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
        </rect>
      </g>
    </g>

    <!-- Stat 2: Pull Requests -->
    <g transform="translate(0, 35)">
      <g class="stat-row" style="animation-delay: 0.5s;">
        <path d="M7.177 3.073L9.573.677A.25.25 0 0 1 10 .854v4.792a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm-2.25.75a2.25 2.25 0 1 1 3 2.122v5.256a2.25 2.25 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25ZM11 2.5h-1V4h1a1.5 1.5 0 0 1 1.5 1.5v5.636a2.25 2.25 0 1 1-1.5 0V5.5a.5.5 0 0 0-.5-.5h-1V6.5h1a2.5 2.5 0 0 1 2.5 2.5v2.636a2.25 2.25 0 1 1-1.5 0V9a1.5 1.5 0 0 0-1.5-1.5h-1V9a.25.25 0 0 1-.427.177L7.177 6.773a.25.25 0 0 1 0-.354l2.396-2.396A.25.25 0 0 1 10 4.2V2.5Z" fill="#bf00ff" transform="scale(1.2) translate(0, -9)"/>
        <text x="25" y="0" font-family="monospace" font-size="13" fill="#dddddd">Pull Requests</text>
        <text x="260" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#bf00ff" text-anchor="end">320</text>
        <rect x="25" y="8" width="235" height="6" rx="3" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
        <rect x="25" y="8" width="0" height="6" rx="3" fill="#bf00ff" filter="url(#purpleGlow)">
          <animate attributeName="width" from="0" to="140" dur="1s" begin="1.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
        </rect>
      </g>
    </g>

    <!-- Stat 3: Issues -->
    <g transform="translate(0, 70)">
      <g class="stat-row" style="animation-delay: 0.7s;">
        <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm9 3a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm-.25-6.25a.75.75 0 0 0-1.5 0v3.5a.75.75 0 0 0 1.5 0v-3.5Z" fill="#bf00ff" transform="scale(1.1) translate(0, -9)"/>
        <text x="25" y="0" font-family="monospace" font-size="13" fill="#dddddd">Issues Opened</text>
        <text x="260" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#bf00ff" text-anchor="end">112</text>
        <rect x="25" y="8" width="235" height="6" rx="3" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
        <rect x="25" y="8" width="0" height="6" rx="3" fill="#bf00ff" filter="url(#purpleGlow)">
          <animate attributeName="width" from="0" to="80" dur="1s" begin="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
        </rect>
      </g>
    </g>

    <!-- Stat 4: Stars -->
    <g transform="translate(0, 105)">
      <g class="stat-row" style="animation-delay: 0.9s;">
        <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z" fill="#bf00ff" transform="scale(1.1) translate(0, -10)"/>
        <text x="25" y="0" font-family="monospace" font-size="13" fill="#dddddd">Stars Earned</text>
        <text x="260" y="0" font-family="monospace" font-size="13" font-weight="bold" fill="#bf00ff" text-anchor="end">45</text>
        <rect x="25" y="8" width="235" height="6" rx="3" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
        <rect x="25" y="8" width="0" height="6" rx="3" fill="#bf00ff" filter="url(#purpleGlow)">
          <animate attributeName="width" from="0" to="50" dur="1s" begin="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
